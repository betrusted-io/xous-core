on:
  push:
    branches:
      - main
      - dev
      - "feature/**"
  pull_request:
    branches:
      - main
      - dev

name: Build xous-core

jobs:
  build:
    name: Setup Rust
    runs-on: ubuntu-latest
    strategy:
      matrix:
        task: ["bao1x-boot0", "bao1x-boot1", "bao1x-alt-boot1", "bao1x-baremetal-dabao", "dabao", "baosec", "hosted-bao1x-ci", "hosted-ci", "renode-image"]
    steps:
      - name: Install Ubuntu dependencies
        run: |
          sudo apt update
          sudo apt install -y libxkbcommon-dev

      - name: Update to latest toolchain
        run: rustup update

      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Fetch tags
        run: git fetch --prune --unshallow --tags

      - name: Fetch upstream release tags (forks may lack annotated tags for signing)
        continue-on-error: true
        run: |
          git remote add upstream https://github.com/betrusted-io/xous-core.git 2>/dev/null || true
          git fetch upstream --tags --prune --no-recurse-submodules

      - uses: Swatinem/rust-cache@v1

      - name: Install RISC-V toolkit
        run: cargo xtask install-toolkit --force --no-verify

      - name: Clean out old target directory (in case of libstd change)
        run: rm -rf target/*

      - name: Build CI targets
        run: cargo xtask ${{ matrix.task }} --no-verify

  bao1x-checks:
    name: bao1x slot-map consistency checks
    runs-on: ubuntu-latest
    steps:
      - name: Update to latest toolchain
        run: rustup update

      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Run slot-map consistency checks
        run: cargo run --bin bao1x-checks --manifest-path libs/bao1x-checks/Cargo.toml
