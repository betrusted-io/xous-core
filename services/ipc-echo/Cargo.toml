[package]
name = "ipc-echo"
version = "0.1.0"
authors = ["Xous contributors"]
edition = "2018"
description = "Minimal MutableBorrow echo server for the IPC Renode CI suite"

# Dependency versions enforced by Cargo.lock.
[dependencies]
xous = "0.9.71"
log-server = { package = "xous-api-log", version = "0.1.71" }
xous-names = { package = "xous-api-names", version = "0.9.73" }
xous-ipc = "0.10.12"
log = "0.4.14"
rkyv = { version = "0.8.8", default-features = false, features = [
    "std",
    "alloc",
] }

# The xtask renode targets push a bare `--features renode` at every package.
[features]
renode = []
default = []
