[package]
name = "ipc-tests"
version = "0.1.0"
authors = ["Xous contributors"]
edition = "2018"
description = "xous-ipc buffer regression suite runner for Renode CI"

# Dependency versions enforced by Cargo.lock.
[dependencies]
xous = "0.9.71"
log-server = { package = "xous-api-log", version = "0.1.70" }
ticktimer-server = { package = "xous-api-ticktimer", version = "0.9.71" }
xous-names = { package = "xous-api-names", version = "0.9.72" }
xous-ipc = "0.10.11"
log = "0.4.14"
rkyv = { version = "0.8.8", default-features = false, features = [
    "std",
    "alloc",
] }
ipc-echo = { path = "../ipc-echo" }

# The xtask renode targets push a bare `--features renode` at every package.
[features]
renode = []
default = []
