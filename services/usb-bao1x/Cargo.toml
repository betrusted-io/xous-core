[package]
name = "usb-bao1x"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
utralib = { version = "0.1.27", optional = true, default-features = false }
xous-names = { package = "xous-api-names", version = "0.9.71" }
ticktimer = { package = "xous-api-ticktimer", version = "0.9.70" }
xous = "0.9.70"
xous-ipc = "0.10.10"
log-server = { package = "xous-api-log", version = "0.1.69" }
log = "0.4.14"
num-derive = { version = "0.4.2", default-features = false }
num-traits = { version = "0.2.14", default-features = false }
bao1x-hal = { path = "../../libs/bao1x-hal", features = [
    "std",
    # "debug-print-usb",
    # "verbose-debug",
    "axp2101",
], optional = true }
bao1x-api = { path = "../../libs/bao1x-api" }
bao1x-hal-service = { path = "../bao1x-hal-service", optional = true }
bao1x-emu = { path = "../bao1x-emu", optional = true }
# Optional: only to forward `hosted-baosec` onto `ux-api` (pulled by `bao1x-emu`).
# Without this, `ux-api` builds with `std` but no board feature, so `blitstr2` is missing.
ux-api = { path = "../../libs/ux-api", optional = true }
xous-usb-hid = { git = "https://github.com/betrusted-io/xous-usb-hid.git", branch = "main" }
rkyv = { version = "0.8.8", default-features = false, features = [
    "std",
    "alloc",
] }
packed_struct = { version = "0.10", default-features = false } # used by the xous-usb-hid crate
locales = { path = "../../locales" }
frunk_core = "0.4.2"
# for debugging interrupts
riscv = { version = "0.5.6", package = "xous-riscv" }

usb-device = { git = "https://github.com/betrusted-io/usb-device.git", branch = "main", features = [
    "log",
    "control-buffer-256",
] }

# Serial support
usbd-serial = { git = "https://github.com/betrusted-io/usbd-serial.git", branch = "v0.1.1-betrusted", features = [
    "max-packet-size-512",
] }

# Optional PDDB helpers for offline CCID provisioning tooling (not required for USB transport).
pddb = { path = "../pddb", optional = true, default-features = false, features = ["mbbb"] }

[features]
bao1x = []
board-baosec = [
    "utralib/bao1x",
    "utralib/std",
    "bao1x-hal",
    "bao1x-hal/board-baosec",
    "bao1x-hal-service",
    "bao1x-hal-service/board-baosec",
    "pddb?/board-baosec",
]
oem-baosec-lite = ["bao1x-hal/oem-baosec-lite"]
board-dabao = [
    "utralib/bao1x",
    "utralib/std",
    "bao1x-hal",
    "bao1x-hal/board-dabao",
    "bao1x-hal-service",
    "bao1x-hal-service/board-dabao",
]
hosted-baosec = [
    "utralib/hosted",
    "utralib/std",
    "bao1x-emu",
    "dep:ux-api",
    "ux-api/hosted-baosec",
    "pddb?/hosted-baosec",
]
# none of these other modes are actually supported, but are listed here
# to allow direct re-use of API code
precursor = ["utralib/precursor", "utralib/std"]
hosted = ["utralib/hosted", "utralib/std"]
renode = ["utralib/renode", "utralib/std"]
mass-storage = []
debug-print-usb = [
    "bao1x-hal/debug-print-duart",
] # mutually exclusive feature with other crates that use the app UART
verbose-debug = ["bao1x-hal/verbose-debug"]
# Evidence-gathering for Corigine IRQ lost-wakeup hypothesis (see driver enable_interrupts).
irq-pending-trace = ["bao1x-hal/irq-pending-trace"]

# mutually exclusive with kernel "print-panics"; will get a DUART allocation error on boot if kernel panics are on
# sticks the DUART into the deep stack; necessary because we can't have external dependencies in usbd-device
# and the DUART can be banged with simple hard-coded memory offsets.
usbd-debug = ["usb-device/baochip-debug", "debug-print-usb"]

prototyping = [
] # temporary feature-out for figuring out the code; remove this if you don't recognize it anymore

# Generic USB CCID bulk transport (Persona A: no USB CDC on CCID images).
# Does not require pddb — dabao has no SPI flash / gen2 PDDB path.
ccid-openpgp = []
# Optional offline PDDB provisioning helpers (baosec images with a PDDB service).
ccid-pddb = ["dep:pddb", "ccid-openpgp"]
# HIL personality: echo PC_to_RDR frames on bulk IN (requires ccid-openpgp).
ccid-echo = ["ccid-openpgp"]

default = []
