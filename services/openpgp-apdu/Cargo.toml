[package]
name = "openpgp-apdu"
version = "0.1.0"
edition = "2021"
description = "Minimal OpenPGP CCID APDU test harness for dabao-ccid (deferred IPC handler)"

[lib]
name = "openpgp_apdu"
path = "src/lib.rs"

[[bin]]
name = "openpgp-apdu"
path = "src/main.rs"

[dependencies]
log = "0.4.14"

[target.'cfg(target_os = "xous")'.dependencies]
xous = "0.9.70"
xous-ipc = "0.10.10"
xous-names = { package = "xous-api-names", version = "0.9.71" }
log-server = { package = "xous-api-log", version = "0.1.69" }
ticktimer = { package = "xous-api-ticktimer", version = "0.9.70" }
rkyv = { version = "0.8.8", default-features = false, features = ["std", "alloc"] }
