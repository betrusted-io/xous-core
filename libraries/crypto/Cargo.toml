[package]
name = "ctap-crypto-vault2"
version = "0.1.0"
authors = [
  "Fabian Kaczmarczyck <kaczmarczyck@google.com>",
  "Guillaume Endignoux <guillaumee@google.com>",
  "Jean-Michel Picod <jmichel@google.com>",
]
license = "Apache-2.0"
edition = "2018"

[dependencies]
cbor = { path = "../cbor", package = "cbor-vault2" }
arrayref = "0.3.6"
subtle = { version = "2.2.3", default-features = false }
bao1x-hal-service = { git = "https://github.com/betrusted-io/xous-core", rev = "616bf65f6e379165464f50b1e79ec42aff77a683", optional = true }
bao1x-emu = { git = "https://github.com/betrusted-io/xous-core", rev = "616bf65f6e379165464f50b1e79ec42aff77a683", optional = true }
xous-names = { package = "xous-api-names", version = "0.9.67" }
rand_core = "0.6.4"
p256 = { version = "0.11.1", default-features = false, features = [
  "ecdsa",
  "ecdh",
  "std",
] }
cbc = "0.1.2"
aes = { git = "https://github.com/betrusted-io/xous-core", rev = "616bf65f6e379165464f50b1e79ec42aff77a683" }
sha2 = { version = "0.10.8" }

log = "0.4.14" # xous debugging

getrandom = "=0.2.12"

[patch.crates-io.getrandom]
git = "https://github.com/betrusted-io/xous-core"
rev = "616bf65f6e379165464f50b1e79ec42aff77a683"

[target.'cfg(any(windows,unix))'.dependencies]
rand = "0.8.5"
rand_chacha = "0.3.1"
cbor = { path = "../cbor", package = "cbor-vault2" }
regex = { version = "1" }
untrusted = { version = "0.7.0" }
hex = { version = "0.3.2", default-features = false } # do not update this, it's required to be at this version for tests to work.
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
# ring = { version = "0.16.11" }
byteorder = { version = "1", default-features = false }
rfc6979 = "0.2.0"

[features]
board-baosec = ["bao1x-hal-service"]
hosted-baosec = ["bao1x-emu"]
with_ctap1 = []
derive_debug = []
