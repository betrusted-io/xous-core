[package]
name = "dc34-vault"
version = "0.1.0"
edition = "2021"

[dependencies]
log = "0.4.14"
num-derive = { version = "0.4.2", default-features = false }
num-traits = { version = "0.2.14", default-features = false }
xous = "0.9.66"
xous-ipc = "0.10.6"
rkyv = { version = "0.8.8", default-features = false, features = [
    "std",
    "alloc",
] }
log-server = { package = "xous-api-log", version = "0.1.65" }
xous-names = { package = "xous-api-names", version = "0.9.67" }
byteorder = { version = "1.4.3", default-features = false }
arrayref = "0.3.6"
subtle = { version = "2.5.0", features = ["core_hint_black_box"] }
rand_core = "=0.6.4"
ticktimer-server = { package = "xous-api-ticktimer", version = "0.9.65" }
backup = { path = "./libraries/backup", package = "backup-vault2" }
dc34-api = { path = "../dc34-api" }

# opensk
persistent_store = { git = "https://github.com/betrusted-io/xous-core", rev = "616bf65f6e379165464f50b1e79ec42aff77a683" }

ctap-crypto = { path = "./libraries/crypto", package = "ctap-crypto-vault2" }
cbor = { path = "./libraries/cbor", package = "cbor-vault2" }
ed25519-compact = { version = "1", default-features = false, optional = true }
rand = { version = "0.8.5" }
locales = { git = "https://github.com/betrusted-io/xous-core", rev = "616bf65f6e379165464f50b1e79ec42aff77a683" }
pddb = { git = "https://github.com/betrusted-io/xous-core", rev = "616bf65f6e379165464f50b1e79ec42aff77a683" }
modals = { git = "https://github.com/betrusted-io/xous-core", rev = "616bf65f6e379165464f50b1e79ec42aff77a683", features = [
    "no-gam",
] }
userprefs = { git = "https://github.com/betrusted-io/xous-core", rev = "616bf65f6e379165464f50b1e79ec42aff77a683" }
ux-api = { git = "https://github.com/betrusted-io/xous-core", rev = "616bf65f6e379165464f50b1e79ec42aff77a683" }
bao1x-api = { git = "https://github.com/betrusted-io/xous-core", rev = "616bf65f6e379165464f50b1e79ec42aff77a683" }
bao1x-hal = { git = "https://github.com/betrusted-io/xous-core", rev = "616bf65f6e379165464f50b1e79ec42aff77a683", features = ["board-baosec", "oem-baosec-lite"] }
bao1x-hal-service = { git = "https://github.com/betrusted-io/xous-core", rev = "616bf65f6e379165464f50b1e79ec42aff77a683", optional = true }
bao1x-emu = { git = "https://github.com/betrusted-io/xous-core", rev = "616bf65f6e379165464f50b1e79ec42aff77a683", optional = true }
blitstr2 = { git = "https://github.com/betrusted-io/xous-core", rev = "616bf65f6e379165464f50b1e79ec42aff77a683", features = [
    "bao1x",
] }
usb-bao1x = { git = "https://github.com/betrusted-io/xous-core", rev = "616bf65f6e379165464f50b1e79ec42aff77a683" }
xous-usb-hid = { git = "https://github.com/betrusted-io/xous-usb-hid.git", branch = "main" }
keystore = { git = "https://github.com/betrusted-io/xous-core", rev = "616bf65f6e379165464f50b1e79ec42aff77a683" }
susres = { package = "xous-api-susres", git = "https://github.com/betrusted-io/xous-core", rev = "616bf65f6e379165464f50b1e79ec42aff77a683" }
qrcode = { version = "0.12", default-features = false }

aes-gcm-siv = { version = "0.11.1", default-features = false, features = [
    "aes",
] }
aes = { default-features = false, features = [
    "chaffing",
], git = "https://github.com/betrusted-io/xous-core", rev = "616bf65f6e379165464f50b1e79ec42aff77a683" }

# ux formatting
hex = { version = "0.4.3", default-features = false, features = ["alloc"] }
chrono = { version = "0.4.33", default-features = false, features = ["std", "clock"] }

# password generation
passwords = "=3.1.9"
random-pick = { version = "=1.2.15" }

# totp
sha1 = "0.10.6"
hmac = "0.12.1"
digest = "0.9.0"
base32 = "0.4.0"
sha2 = { version = "0.10.8" }
sntpc = { version = "0.3.1" }
# net = { path = "../../services/net" }
# com_rs = { git = "https://github.com/betrusted-io/com_rs", rev = "891bdd3ca8e41f81510d112483e178aea3e3a921" }

# QR code encoding
base45 = "3.1.0"

getrandom = "=0.2.12"

bytemuck = { version = "1.24.0", features = ["derive"] }

[patch.crates-io.getrandom]
git = "https://github.com/betrusted-io/xous-core"
rev = "616bf65f6e379165464f50b1e79ec42aff77a683"

[patch.crates-io.aes]
path = "../xous-core/services/aes"

[profile.release]
codegen-units = 1  # 1 better optimizations
debug = false
strip = false
lto = "fat"
incremental = true
#panic = "abort" # Remove panic output, which can reduce file size
opt-level = "s" # z,s: Optimize for size instead of performance; 1 for easier debugging; comment out for "best performance" (but in Rust 1.72 this causes regressions)

[dev-dependencies]
enum-iterator = "0.6.0"

[patch."https://github.com/betrusted-io/xous-core"]
bao1x-hal = { path = "../xous-core/libs/bao1x-hal" }
bao1x-hal-service = { path = "../xous-core/services/bao1x-hal-service" }
bao1x-api = { path = "../xous-core/libs/bao1x-api" }
modals = { path = "../xous-core/services/modals" }
ux-api = { path = "../xous-core/libs/ux-api" }
bio-lib = { path = "../xous-core/libs/bio-lib" }
xous-api-susres = { path = "../xous-core/api/xous-api-susres" }
blitstr2 = { path = "../xous-core/libs/blitstr2" }
pddb = { path = "../xous-core/services/pddb" }
keystore-api = { path = "../xous-core/libs/keystore-api" }
keystore = { path = "../xous-core/services/keystore" }

[features]
# turns on production-mode handling (ie. faults on developer mode flag being set)
production = []
board-baosec = [
    "bao1x-hal-service",
    "ux-api/board-baosec",
    "ux-api/bip39entry",
    "blitstr2/board-baosec",
    "usb-bao1x/board-baosec",
    "persistent_store/board-baosec",
    "ctap-crypto/board-baosec",
]
hosted-baosec = [
    "bao1x-emu",
    "ux-api/bip39entry",
    "ux-api/hosted-baosec",
    "usb-bao1x/hosted-baosec",
    "ctap-crypto/hosted-baosec",
]

with_ctap1 = ["ctap-crypto/with_ctap1"]
vendor_hid = []
std = []
fuzz = []
debug_ctap = []
autotest = []
multireset = [] # allows credential reset more than once per boot
vault-testing = []
osk-upgrade = [
] # placeholder to select out OpenSK's "vendor upgrade" over HID, which we don't use because we have our own upgrade path.
xous = [
] # marks xous-specific code segments deep inside the CTAP crate. Mostly to help evaluate if a patch is even feasible in the future.
ed25519 = ["ed25519-compact"]
uber = []

# when selected, resets the badge state to factory new
factory-new = []
qa-test = []

default = [
    "with_ctap1",
    "ed25519",
    "xous",
    # "vault-testing", # testing removed for release tag
]
