[package]
name = "ball"
version = "0.1.0"
authors = ["bunnie <bunnie@kosagi.com>"]
edition = "2018"
description = "Ball demo app"

# Dependency versions enforced by Cargo.lock.
[dependencies]
log = "0.4.14"
num-derive = { version = "0.4.2", default-features = false }
num-traits = { version = "0.2.14", default-features = false }
xous = "0.9.71"
xous-ipc = "0.10.11"
log-server = { package = "xous-api-log", version = "0.1.70" }
ticktimer-server = { package = "xous-api-ticktimer", version = "0.9.71" }
xous-names = { package = "xous-api-names", version = "0.9.72" }
gam = { path = "../../services/gam" }
trng = { path = "../../services/trng" }
modals = { path = "../../services/modals" }
com = { path = "../../services/com" }                                     # for the gyro read
locales = { path = "../../locales" }

[features]
default = []
